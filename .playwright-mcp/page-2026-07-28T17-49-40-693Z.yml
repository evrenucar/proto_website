    - paragraph [ref=f23e123]: "Two-way: import once, then keep working in the original tool if you want. Cosmoboard stays in sync with the files it already understands. None of this is about migrating once and forgetting."
    - heading "●Where it lives" [level=2] [ref=f23e124]
    - paragraph [ref=f23e125]:
      - text: Right now Cosmoboard lives inside
      - link "evrenucar.com" [ref=f23e126] [cursor=pointer]:
        - /url: https://evrenucar.com
      - text: ", my personal site. It is the easiest place for me to keep working on it without spinning up a whole separate project around it. Once it grows up a bit, it will probably move to its own home. For now, the personal site is its host and its first real test surface."
