  - main [ref=f23e2]:
    - generic [ref=f23e3]: Cosmoboard
    - heading "A local-first place for canvases, notes, and files to live together." [level=1] [ref=f23e4]
    - paragraph [ref=f23e5]: Cosmoboard is a project I have been working on for the past 10 years. Initially I was just exploring and taking notes on what my ideal workspace and PKMS would be, after being disappointed in existing tools.
    - paragraph [ref=f23e6]: Currently I use a mix of Miro, Obsidian, a small notebook, loose pieces of paper, Notion, and VS Code for all my projects. It works but it ain't pretty. I hope to get this repository to a state where the static version becomes something you go back to and use on a daily basis.
    - paragraph [ref=f23e7]: Let me know if it is not there, how it could get there, and what you would like for it to be there.
    - link "Try the live prototype →" [ref=f23e8] [cursor=pointer]:
      - /url: cosmoboard.html
    - heading "●What it is" [level=2] [ref=f23e9]
    - paragraph [ref=f23e10]: It is one big canvas where you can pan around, zoom in, drop images and PDFs onto it, jot markdown notes, and embed other boards inside it. Every board is a plain file on disk. The idea is that the work is mine and yours, not stuck inside someone else's database somewhere.
    - heading "●What it is not" [level=2] [ref=f23e11]
    - paragraph [ref=f23e12]: It is not a cloud-only workspace. It is not me trying to clone Notion or Miro or Obsidian. It is not finished, and it probably will not be for a while. I am building it piece by piece, in public, inside my personal site, on the days I have the energy for it.
    - heading "●Scope and roadmap" [level=2] [ref=f23e13]
    - paragraph [ref=f23e14]: Four rings. The middle is what has to work without thinking. Each ring outward is further from done.
