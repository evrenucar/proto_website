    - heading "●Bringing your stuff in (PLANNED)" [level=2] [ref=f23e86]
    - paragraph [ref=f23e87]: The whole point of local-first is that your notes are already yours. If they live somewhere else right now, here is how I plan to walk them in without making you redo years of work. Most of these are not built yet — this is the plan.
