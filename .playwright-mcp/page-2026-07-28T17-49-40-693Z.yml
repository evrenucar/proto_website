    - heading "●What I'm working on right now" [level=2] [ref=f23e466]
    - paragraph [ref=f23e467]: The focus right now is making markdown and .canvas files round-trip cleanly with Obsidian, so the same folder opens in both places without any drama. Drag-and-drop imports for images, PDFs, and text files just landed. Next up are a proper onboarding board, a real performance baseline so a couple hundred nodes still pan at 60fps on a 2020 laptop, and the first slice of opt-in encryption so you can share boards privately without needing an account.
    - paragraph [ref=f23e468]: It is being built piece by piece, in public, in a single repo.
    - heading "●How you can help" [level=2] [ref=f23e469]
    - paragraph [ref=f23e470]: The most useful thing you can do is try it, push it until something breaks, and tell me what happened.
    - paragraph [ref=f23e471]: "The board has buttons for that built in:"
    - list [ref=f23e472]:
      - listitem [ref=f23e473]:
        - strong [ref=f23e474]: Recommend
        - text: sends a board you would like to see live, with the canvas attached.
      - listitem [ref=f23e475]:
        - strong [ref=f23e476]: Feature request
        - text: is for something you want.
      - listitem [ref=f23e477]:
        - strong [ref=f23e478]: Bug report
        - text: is for something that broke.
    - paragraph [ref=f23e479]: All three open prefilled GitHub issues. No sign-up beyond GitHub itself.
    - paragraph [ref=f23e480]: If you want to look under the hood, the repo is open. Issues, pull requests, and stars all work the way you would expect.
    - paragraph [ref=f23e481]: "One thing I keep getting stuck on: people should be able to share boards with each other. I have not figured out the right way to do that yet, somewhere between capability links, encrypted shares, and a self-hosted node. If you have ideas about how sharing should feel, I want to hear them."
    - paragraph [ref=f23e482]: My inbox is open. If something here sparked an idea, write to me.
