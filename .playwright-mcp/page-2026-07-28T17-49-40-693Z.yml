    - heading "●Principles" [level=2] [ref=f23e37]
    - paragraph [ref=f23e38]: These are the rules I keep coming back to when I have to make a call on something.
    - generic [ref=f23e39]:
      - generic [ref=f23e40]:
        - heading "Local-first" [level=3] [ref=f23e41]
        - paragraph [ref=f23e42]: Works offline. Saves locally first. Happy to live on a static site without a backend.
      - generic [ref=f23e43]:
        - heading "Portable" [level=3] [ref=f23e44]
        - paragraph [ref=f23e45]: Markdown and JSON Canvas underneath. If I leave, my notes and boards leave with me.
      - generic [ref=f23e46]:
        - heading "File-first" [level=3] [ref=f23e47]
        - paragraph [ref=f23e48]: Every board is just a file on disk. The filesystem stays the boss, not a hidden database.
      - generic [ref=f23e49]:
        - heading "Embeddable" [level=3] [ref=f23e50]
        - paragraph [ref=f23e51]: Boards inside markdown. Markdown inside boards. Files inside both.
      - generic [ref=f23e52]:
        - heading "Safe by default" [level=3] [ref=f23e53]
        - paragraph [ref=f23e54]: Sandboxed embeds. No silent file crawling. Permissions stay explicit, even when it is annoying.
      - generic [ref=f23e55]:
        - heading "Gradual collaboration" [level=3] [ref=f23e56]
        - paragraph [ref=f23e57]: Solo for now. GitHub recommendations next. Realtime co-editing once the rest is solid.
    - heading "●Where your stuff stays" [level=2] [ref=f23e58]
    - paragraph [ref=f23e59]: By default, your boards, notes, and dropped files autosave to your browser, so editing works fully offline. If you are also running the local dev-server, the same edits sync to plain .canvas and .md files in your project folder.
    - paragraph [ref=f23e60]:
      - text: Nothing leaves your machine unless you click
      - strong [ref=f23e61]: Recommend
      - text: ", which opens a GitHub issue with the canvas attached."
    - paragraph [ref=f23e62]: There is no telemetry. No analytics. No silent cloud sync either.
