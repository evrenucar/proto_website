<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Cosmoboard · board</title>
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<style>
  :root {
    --ground: #222222;
    --panel: #1a1919;
    --panel-2: #1f1f1f;
    --card: #1e1d1d;
    --line: #2d2c2c;
    --line-soft: #272626;
    --ink: #fafafa;
    --ink-dim: #9b9b9b;
    --ink-faint: #707070;
    --accent: #3fdaca;
    --accent-soft: rgba(63, 218, 202, 0.11);
    --pass: #5cc47f;
    --warn: #e0b054;
    --fail: #e0655f;
    --idle: #5f5c5a;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1560px; margin: 0 auto; padding: 28px 22px 80px; display: flex; flex-direction: column; gap: 20px; }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
  h1 { font-size: 24px; line-height: 1.15; letter-spacing: -0.015em; margin: 5px 0 0; font-weight: 650; }

  .topline { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .topline .right { margin-left: auto; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }

  .live { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 3px rgba(92,196,127,0.16); }
  .live.stale .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(224,176,84,0.16); }
  .live.down .dot { background: var(--fail); box-shadow: 0 0 0 3px rgba(224,101,95,0.16); }
  .live.down { color: var(--fail); }

  .suites { display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .suite { color: var(--ink-faint); }
  .suite b { font-weight: 650; margin-left: 4px; }
  .suite.ok b { color: var(--pass); }
  .suite.part b { color: var(--warn); }

  /* ---- agent status feed ---- */
  .feed {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    overflow: hidden;
  }
  .feed-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 15px; border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .feed-head h2 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: 0.02em; }
  .who { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .who-chip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    padding: 2px 9px 2px 7px; border-radius: 999px;
    border: 1px solid var(--agent, var(--line)); color: var(--agent, var(--ink-dim));
    display: inline-flex; align-items: center; gap: 6px;
  }
  .who-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--agent, var(--idle)); display: inline-block; flex: none; }
  .who-chip.busy { background: color-mix(in srgb, var(--agent) 10%, transparent); }
  .who-name { font-weight: 650; }
  .who-goal { color: var(--ink-dim); letter-spacing: 0.02em; }
  .who-state { color: var(--ink-faint); }
  .who-chip.busy .who-state { color: var(--agent); }
  .who-sep { color: var(--ink-faint); opacity: 0.55; }
  .who-chip:not(.busy) { opacity: 0.72; }

  ul.feed-list { list-style: none; margin: 0; padding: 0; max-height: 154px; overflow-y: auto; }
  li.feed-item {
    display: grid; grid-template-columns: 116px 88px 1fr; gap: 12px;
    padding: 8px 15px; border-top: 1px solid var(--line-soft);
    font-size: 13px; align-items: baseline;
  }
  li.feed-item:first-child { border-top: none; }
  .feed-when { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .feed-agent { font-family: var(--mono); font-size: 11px; color: var(--agent, var(--ink-dim)); font-weight: 650; overflow-wrap: anywhere; }
  .feed-text { color: var(--ink-dim); min-width: 0; }
  li.feed-item:first-child .feed-text { color: var(--ink); }

  /* ---- add a card ---- */
  .addbar {
    display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px;
  }
  .addbar input[type="text"] {
    flex: 1 1 320px; min-width: 0;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px;
    font-family: var(--sans); font-size: 13.5px;
  }
  .addbar select {
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px;
    font-family: var(--mono); font-size: 12px;
  }
  .addbar input:focus-visible, .addbar select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
  }
  .add-msg { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
  .add-msg.ok { color: var(--pass); }
  .add-msg.err { color: var(--fail); }

  /* ---- kanban ---- */
  /* Four working columns; Done is a full-width bar underneath them, so the
     live columns get the horizontal space. */
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .col--done { grid-column: 1 / -1; }
  .col--done .col-body { max-height: 40vh; }
  @media (max-width: 1180px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr); } }

  .col-toggle {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px;
    color: var(--ink-faint); cursor: pointer; margin-left: 8px;
  }
  .col-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .col--collapsed .col-head { border-bottom: none; }

  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .col-head {
    padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
    display: flex; align-items: center; gap: 9px;
  }
  .col-head h2 { margin: 0; font-size: 12.5px; font-weight: 650; letter-spacing: 0.02em; }
  .col-count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
    color: var(--ink-faint); background: var(--ground); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 7px;
  }
  .col-mark { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; max-height: 62vh; overflow-y: auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--lane, var(--idle));
    border-radius: 7px;
    padding: 10px 11px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .card.claimed { border-color: var(--agent); border-left-color: var(--agent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--agent) 26%, transparent); }
  .card.done .card-title { color: var(--ink-dim); }

  .card-top { display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
  .lane {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--lane, var(--ink-faint)); border: 1px solid currentColor; border-radius: 3px; padding: 0 5px;
  }
  .owner {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.07em;
    color: var(--agent); border: 1px solid currentColor; border-radius: 3px; padding: 0 5px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .owner i { width: 5px; height: 5px; border-radius: 50%; background: var(--agent); display: inline-block; }

  /* ---- priority 1-5 per card ---- */
  .prio-row { display: inline-flex; gap: 3px; margin-left: auto; }
  .pb {
    width: 17px; height: 17px; padding: 0; border-radius: 4px; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; line-height: 1;
    background: none; border: 1px solid var(--line); color: var(--ink-faint);
  }
  .pb:hover { border-color: var(--p); color: var(--p); }
  .pb.on { background: var(--p); border-color: var(--p); color: #161515; font-weight: 700; }
  .pb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .card-title { font-size: 13.5px; font-weight: 550; line-height: 1.42; overflow-wrap: anywhere; min-width: 0; }
  .eb {
    background: none; border: none; padding: 0 2px; cursor: pointer;
    color: var(--ink-faint); font-size: 11px; line-height: 1;
  }
  .eb:hover { color: var(--accent); }
  .eb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
  .title-edit {
    width: 100%; background: var(--ground); color: var(--ink);
    border: 1px solid var(--accent); border-radius: 4px; padding: 4px 7px;
    font: inherit; font-size: 13px;
  }
  .title-edit:focus-visible { outline: none; }
  .card-note { color: var(--ink-dim); font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }

  /* Compact mode: headings only */
  body.compact .card-note,
  body.compact .more,
  body.compact .said,
  body.compact .review,
  body.compact .card-meta { display: none; }
  body.compact .card { gap: 3px; padding: 7px 9px; }
  .compact-toggle {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
    color: var(--ink-faint); cursor: pointer;
  }
  .compact-toggle:hover { color: var(--ink); border-color: var(--ink-faint); }
  .compact-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .compact-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-note.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .more {
    align-self: flex-start; background: none; border: none; padding: 0;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); cursor: pointer;
  }
  .more:hover { color: var(--accent); }
  .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  code {
    font-family: var(--mono); font-size: 0.86em;
    background: var(--ground); border: 1px solid var(--line-soft);
    padding: 0.5px 4px; border-radius: 3px; word-break: break-word;
  }
  strong { font-weight: 650; }

  .empty-col { color: var(--ink-faint); font-size: 12.5px; padding: 8px 2px; font-family: var(--mono); }

  /* ---- drag to move a card between columns ---- */
  .card { cursor: grab; }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.45; }
  .card.busy { opacity: 0.5; pointer-events: none; }
  .col-body.over { background: color-mix(in srgb, var(--accent) 9%, transparent); outline: 1px dashed var(--accent); outline-offset: -4px; }

  /* ---- per-card review ---- */
  .verdict {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; color: var(--ink-faint);
  }
  .verdict.works { color: #5cc47f; }
  .verdict.issue { color: #e0655f; }

  .said {
    font-size: 11.5px; line-height: 1.4; color: var(--ink-dim);
    border-left: 2px solid var(--line); padding-left: 8px;
  }
  .said span {
    display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 2px;
  }

  .card-meta {
    font-family: var(--mono); font-size: 9.5px; color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  .review { display: flex; gap: 5px; align-items: center; margin-top: 2px; }
  .vb {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px;
    color: var(--ink-faint); cursor: pointer; flex: none;
  }
  .vb:hover { color: var(--ink); border-color: var(--ink-faint); }
  .vb.works:hover { color: #5cc47f; border-color: #5cc47f; }
  .vb.issue:hover { color: #e0655f; border-color: #e0655f; }
  .vb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rnote {
    flex: 1; min-width: 0; background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: inherit; font-size: 11.5px;
    cursor: text;
  }
  .rnote:focus-visible { outline: none; border-color: var(--accent); }

  /* ---- questions ---- */
  .qpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .qpanel-head { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: flex; gap: 10px; align-items: baseline; }
  .qpanel-head h2 { margin: 0; font-size: 13px; font-weight: 650; }
  .qpanel-head .sub { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .q { border-top: 1px solid var(--line-soft); padding: 14px 16px; }
  .q:first-of-type { border-top: none; }
  .q-head { display: flex; gap: 9px; align-items: baseline; }
  .q-num { font-family: var(--mono); font-size: 11.5px; color: var(--accent); font-weight: 650; }
  .q-title { font-size: 14px; font-weight: 600; }
  .q-why { color: var(--ink-dim); font-size: 12.5px; margin: 5px 0 10px 24px; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin-left: 24px; }
  .opt {
    display: flex; gap: 9px; align-items: flex-start; padding: 8px 11px;
    border: 1px solid var(--line); border-radius: 7px; background: transparent;
    color: inherit; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; width: 100%;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt-key { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); padding-top: 2px; }
  .opt[aria-pressed="true"] .opt-key { color: var(--accent); font-weight: 700; }
  .opt-text strong { display: block; }
  .opt-text span { color: var(--ink-dim); font-size: 12.5px; }
  .rec { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 3px; padding: 1px 5px; margin-left: 6px; }

  .freeform { padding: 14px 16px 0; border-top: 1px solid var(--line-soft); }
  label.ff-label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 7px; }
  textarea {
    width: 100%; min-height: 60px; resize: vertical; background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
    font-family: var(--sans); font-size: 13.5px; line-height: 1.5;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 13px 16px 15px; }
  button.primary { font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 15px; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: var(--ground); cursor: pointer; }
  button.ghost { font: inherit; font-size: 13.5px; padding: 8px 13px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink-dim); cursor: pointer; }
  button.primary:hover { opacity: 0.87; }
  button.ghost:hover { border-color: var(--accent); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copied { font-family: var(--mono); font-size: 12px; color: var(--pass); opacity: 0; transition: opacity 160ms ease; }
  .copied.show { opacity: 1; }
  .out {
    margin: 0 16px 16px; padding: 11px 13px; background: var(--ground);
    border: 1px dashed var(--line); border-radius: 7px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; color: var(--ink-dim);
    max-height: 170px; overflow-y: auto;
  }

  footer.foot { color: var(--ink-faint); font-size: 12.5px; text-align: center; font-family: var(--mono); }
  footer.foot a { color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="topline">
    <div>
      <div class="eyebrow" id="branch">proto_website</div>
      <h1>Cosmoboard board</h1>
    </div>
    <div class="right">
      <button type="button" class="compact-toggle" id="reload-hint" hidden>New version · reload</button>
      <button type="button" class="compact-toggle" id="compact-toggle" aria-pressed="false">Compact</button>
      <div class="suites" id="suites"></div>
      <div class="live" id="live"><span class="dot"></span><span id="live-text">connecting</span></div>
    </div>
  </header>

  <section class="feed" aria-label="Agent status updates">
    <div class="feed-head">
      <h2>Status feed</h2>
      <div class="who" id="who"></div>
    </div>
    <ul class="feed-list" id="feed"></ul>
  </section>

  <form class="addbar" id="addbar" aria-label="Add a card">
    <input id="add-text" type="text" placeholder="Something to do, a bug you hit, an idea…" autocomplete="off">
    <select id="add-section" aria-label="Section">
      <option value="Bugs">Bugs</option>
      <option value="Now">Now</option>
      <option value="Test failures">Test failures</option>
      <option value="Features and ideas" selected>Features and ideas</option>
      <option value="Later">Later</option>
    </select>
    <button type="submit" class="primary" id="add-btn">Add card</button>
    <span class="add-msg" id="add-msg"></span>
  </form>

  <section class="board" id="board" aria-label="Task board"></section>

  <section class="qpanel" id="qpanel" hidden>
    <div class="qpanel-head">
      <h2>Waiting on you</h2>
      <span class="sub" id="answered">0 of 0</span>
    </div>
    <form id="qform"></form>
  </section>

  <footer class="foot">
    Live from <code>.agents/todo.md</code> · <a href="/cosmoboard.html">cosmoboard</a> · <a href="/onboarding.html">onboarding</a> · <a href="/braindump.html">braindump</a> · <a href="/content/boards/dev.html">dev board</a> · <a href="/content/boards/test-board.html">test board</a>
  </footer>
</div>

<script>
(function () {
  var KEY = "cosmoboard-tracker-v1";
  var POLL_MS = 4000;
  var state = {}, notesValue = "", questions = [], lastOk = 0;
  var lastTodo = null, lastMeta = null, lastFeed = null, lastReview = null, lastCardMeta = null, lastAgents = null;
  var expanded = {};
  var feedbackIndex = {}, noteDrafts = {}, cardMetaIndex = {};

  var compactMode = false;

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      state = p.state || {}; notesValue = p.notes || "";
      // Feedback drafts survive a reload until they are actually sent.
      noteDrafts = p.drafts || {};
      compactMode = p.compact === true;
    }
  } catch (e) { state = {}; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ state: state, notes: notesValue, drafts: noteDrafts, compact: compactMode })); } catch (e) {}
  }

  function applyCompactMode() {
    document.body.classList.toggle("compact", compactMode);
    var btn = document.getElementById("compact-toggle");
    if (btn) btn.setAttribute("aria-pressed", String(compactMode));
  }

  document.getElementById("compact-toggle").addEventListener("click", function () {
    compactMode = !compactMode;
    applyCompactMode();
    save();
  });
  applyCompactMode();

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function inline(s) {
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; });
    out = out.replace(/\*\*([^*]+)\*\*/g, function (_, b) { return "<strong>" + b + "</strong>"; });
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t) { return t; });
    return out;
  }

  // Stable colour per agent name, so a new agent gets a distinct hue with no
  // registry to maintain. Hues avoid the 150-200 band the teal accent occupies.
  function agentColor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    var hue = (h % 260) + 200;
    if (hue > 360) hue -= 360;
    if (hue > 150 && hue < 200) hue = (hue + 90) % 360;
    return "hsl(" + hue + " 70% 62%)";
  }

  // Declared identities from .tracker/agents.json. A declared agent wins over
  // the hash: it gets the colour it registered and is named by its model and
  // number, with the goal it is working on. Anyone not in the registry still
  // renders, with the hashed colour and their bare name.
  var agentRegistry = [], agentById = {};

  function setRegistry(list) {
    agentRegistry = (Array.isArray(list) ? list : []).filter(function (a) { return a && a.id; });
    agentById = {};
    agentRegistry.forEach(function (a) { agentById[a.id] = a; });
  }

  // Agent 0 is a real agent, so test for a number rather than for truth.
  function agentNumber(a) { return typeof a.n === "number" ? a.n : null; }

  function agentInfo(id) {
    var a = agentById[id];
    if (!a) return { id: id, label: id, goal: "", color: agentColor(id), known: false };
    var n = agentNumber(a);
    var label = a.model ? (n === null ? a.model : a.model + " · " + n) : id;
    return { id: id, label: label, goal: a.goal || "", color: a.color || agentColor(id), known: true };
  }

  // The per-agent feeds are appended to while we read them, so the last line can
  // arrive half written. Parse line by line and drop whatever does not parse,
  // rather than losing the whole file to one torn tail.
  function parseJsonl(text, agent) {
    var out = [];
    String(text || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      try {
        var o = JSON.parse(line);
        if (o && o.text) out.push({ at: o.at, agent: agent, text: o.text });
      } catch (e) {}
    });
    return out;
  }

  // Priority colours, 1 loudest to 5 calmest.
  var PRIO = { 1: "#e0655f", 2: "#e08a54", 3: "#e0b054", 4: "#5cc47f", 5: "#7f8c9b" };

  var COLUMNS = [
    { key: ".", title: "Backlog", mark: "[.]" },
    { key: " ", title: "To do", mark: "[ ]" },
    { key: "~", title: "In progress", mark: "[~]" },
    { key: "A", title: "Review", mark: "[A]" },
    { key: "x", title: "Done", mark: "[x]", collapsed: true }
  ];

  // Sections of todo.md that carry task state. Everything else in that file is
  // prose about how to use it and does not belong on a board.
  var LANES = {
    "Now": "#3fdaca",
    "Bugs": "#e0655f",
    "Test failures": "#e0b054",
    "Dead code": "#9b8fd6",
    "Features and ideas": "#5cc47f",
    "Waiting on your review": "#e08fb8",
    "Later": "#7f8c9b"
  };

  function parseTodo(md) {
    var lines = md.split(/\r?\n/);
    var section = null, cards = [], item = null;

    function push() { if (item) cards.push(item); item = null; }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var h = /^##\s+(.+?)\s*$/.exec(line);
      if (h) { push(); section = LANES[h[1]] ? h[1] : null; continue; }
      if (!section) continue;

      var m = /^-\s+\[([ xA~.])\]\s+(.*)$/.exec(line);
      if (m) {
        push();
        var text = m[2];
        var owner = null;
        var at = /(^|\s)@([a-z0-9][a-z0-9._-]*)/i.exec(text);
        if (at) { owner = at[2]; text = text.replace(at[0], "").trim(); }
        var priority = null;
        var pr = /(^|\s)!p([1-5])\b/i.exec(text);
        if (pr) { priority = Number(pr[2]); text = text.replace(pr[0], pr[1]).replace(/\s+/g, " ").trim(); }
        // `line` and `raw` are what the write endpoint uses to find this card
        // again, and to refuse the write if the file moved underneath us.
        item = { status: m[1], lane: section, owner: owner, priority: priority, text: text, extra: [], line: i, raw: line };
        continue;
      }
      if (item && /^\s{2,}\S/.test(line)) { item.extra.push(line.trim()); continue; }
      if (item && line.trim() === "") push();
    }
    push();
    return cards;
  }

  function cardId(c) { return c.lane + "|" + c.text.slice(0, 60); }

  // Feedback is keyed by lane and title rather than by line number, so a card
  // keeps what you said about it after the file shifts around it.
  function feedbackFor(id) { return feedbackIndex[id] || null; }

  function indexFeedback(entries) {
    var out = {};
    // Newest first in the file, so the first hit for a card is the current one.
    (entries || []).forEach(function (e) {
      var key = (e.lane || "") + "|" + String(e.title || "").slice(0, 60);
      if (!out[key]) out[key] = e;
    });
    feedbackIndex = out;
  }

  function renderBoard(cards) {
    var host = document.getElementById("board");
    var html = "";
    COLUMNS.forEach(function (col) {
      // Prioritised cards float to the top of their column, 1 first; the rest
      // keep file order (sort is stable).
      // Actively claimed cards first, then priority, then file order.
      var mine = cards.filter(function (c) { return c.status === col.key; })
        .sort(function (a, b) {
          var ownered = (a.owner ? 0 : 1) - (b.owner ? 0 : 1);
          if (ownered !== 0) return ownered;
          return (a.priority || 9) - (b.priority || 9);
        });
      // Collapsible columns (Done) render as a header stub until opened, so a
      // long Done list stops eating vertical space.
      var isCollapsed = col.collapsed && !expanded["col:" + col.key];
      html += '<div class="col' + (isCollapsed ? " col--collapsed" : "") + (col.collapsed ? " col--done" : "") + '"><div class="col-head"><span class="col-mark">' + esc(col.mark) + "</span>" +
        "<h2>" + esc(col.title) + '</h2>';
      if (col.collapsed) {
        html += '<button type="button" class="col-toggle" data-col="' + esc(col.key) + '">' + (isCollapsed ? "show" : "hide") + "</button>";
      }
      html += '<span class="col-count">' + mine.length + "</span></div>";
      if (isCollapsed) { html += "</div>"; return; }
      html += '<div class="col-body" data-status="' + esc(col.key) + '">';
      if (!mine.length) html += '<div class="empty-col">empty</div>';
      mine.forEach(function (c) {
        var lane = LANES[c.lane] || "#5f5c5a";
        var styles = "--lane:" + lane + ";";
        var cls = "card";
        var own = c.owner ? agentInfo(c.owner) : null;
        if (own) { styles += "--agent:" + own.color + ";"; cls += " claimed"; }
        if (c.status === "x") cls += " done";
        var id = cardId(c);
        var note = c.extra.join(" ");
        var long = note.length > 150;
        var open = expanded[id];
        var said = feedbackFor(id);
        html += '<article class="' + cls + '" style="' + styles + '" draggable="true"' +
          ' data-line="' + c.line + '" data-lane="' + esc(c.lane) + '"' +
          ' data-expect="' + esc(c.raw.replace(/^-\s+\[[ xA~.]\]\s+/, "").slice(0, 40)) + '"' +
          ' data-priority="' + (c.priority || 0) + '"' +
          ' data-id="' + esc(id) + '">';
        html += '<div class="card-top"><span class="lane">' + esc(c.lane) + "</span>";
        if (own) {
          html += '<span class="owner" title="' + esc(own.id + (own.goal ? " · " + own.goal : "")) + '"><i></i>' +
            esc(own.label) + "</span>";
        }
        if (said) html += '<span class="verdict ' + esc(said.verdict || "note") + '">' + esc(said.verdict || "note") + "</span>";
        html += '<span class="prio-row" role="group" aria-label="Priority">';
        for (var p = 1; p <= 5; p++) {
          var on = c.priority === p;
          html += '<button type="button" class="pb' + (on ? " on" : "") + '" style="--p:' + PRIO[p] + '"' +
            ' data-prio="' + p + '" aria-pressed="' + on + '"' +
            ' aria-label="' + (on ? "Clear priority " + p : "Set priority " + p) + '"' +
            ' title="' + (on ? "Clear priority " + p : "Set priority " + p) + '">' + p + "</button>";
        }
        html += "</span></div>";
        html += '<div class="card-title" data-text="' + esc(c.text) + '">' + inline(c.text) +
          ' <button type="button" class="eb" title="Edit card text" aria-label="Edit card text">&#9998;</button></div>';
        if (note) {
          html += '<div class="card-note' + (long && !open ? " clamped" : "") + '">' + inline(note) + "</div>";
          if (long) html += '<button type="button" class="more" data-id="' + esc(id) + '">' + (open ? "less" : "more") + "</button>";
        }
        if (said && said.note) {
          html += '<div class="said"><span>you said</span>' + esc(said.note) + "</div>";
        }
        var meta = cardMetaIndex[c.text.slice(0, 60)];
        if (meta && (meta.createdAt || meta.updatedAt)) {
          var when = function (iso) {
            try {
              var d = new Date(iso);
              return isNaN(d) ? "" : d.toLocaleDateString([], { day: "2-digit", month: "short" }) +
                " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            } catch (err) { return ""; }
          };
          var bits = [];
          if (meta.createdAt) bits.push("created " + when(meta.createdAt));
          if (meta.updatedAt) bits.push("updated " + when(meta.updatedAt) + (meta.updatedBy ? " by " + esc(meta.updatedBy) : ""));
          html += '<div class="card-meta">' + bits.join(" · ") + "</div>";
        }
        html += '<div class="review">';
        html += '<button type="button" class="vb works" data-verdict="works" title="Verified, moves to Done">works</button>';
        html += '<button type="button" class="vb issue" data-verdict="issue" title="Still wrong, moves back to To do">issue</button>';
        html += '<input type="text" class="rnote" placeholder="feedback…" aria-label="Feedback" value="' + esc(noteDrafts[id] || "") + '">';
        html += '<button type="button" class="vb send" data-verdict="">send</button>';
        html += "</div>";
        html += "</article>";
      });
      html += "</div></div>";
    });
    host.innerHTML = html;
  }

  function renderFeed(rawFeed) {
    // Sort rather than trusting file order. Agents are told to prepend, but two
    // entries written in one pass are easy to get backwards, and a status feed
    // showing an older line above a newer one is worse than useless.
    var feed = rawFeed.slice().sort(function (a, b) {
      return new Date(b.at || 0) - new Date(a.at || 0);
    });
    var list = document.getElementById("feed");
    if (!feed.length) { list.innerHTML = '<li class="feed-item"><span class="feed-when"></span><span class="feed-agent"></span><span class="feed-text">No updates yet.</span></li>'; return; }
    list.innerHTML = feed.slice(0, 40).map(function (f) {
      var when = "";
      try {
        var d = new Date(f.at);
        when = isNaN(d) ? String(f.at || "") : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " " + d.toLocaleDateString([], { day: "2-digit", month: "short" });
      } catch (e) { when = String(f.at || ""); }
      var info = f.agent ? agentInfo(f.agent) : null;
      var color = info ? info.color : "var(--ink-dim)";
      return '<li class="feed-item" style="--agent:' + color + '"><span class="feed-when">' + esc(when) +
        '</span><span class="feed-agent"' + (info ? ' title="' + esc(info.id) + '"' : "") + '>' +
        esc(info ? info.label : "") + '</span><span class="feed-text">' + inline(f.text || "") + "</span></li>";
    }).join("");
  }

  function renderWho(cards, feed) {
    var busy = {};
    cards.forEach(function (c) { if (c.status === "~" && c.owner) busy[c.owner] = true; });
    // Declared agents first, in the order they numbered themselves, so the strip
    // stays put as they pick work up and put it down. Anyone holding a card or
    // posting to the feed without registering follows on the end.
    var order = [], seen = {};
    var add = function (id) { if (id && !seen[id]) { seen[id] = true; order.push(id); } };
    agentRegistry.slice()
      .sort(function (a, b) {
        var x = agentNumber(a), y = agentNumber(b);
        return (x === null ? 99 : x) - (y === null ? 99 : y);
      })
      .forEach(function (a) { add(a.id); });
    Object.keys(busy).forEach(add);
    feed.forEach(function (f) { add(f.agent); });

    document.getElementById("who").innerHTML = order.map(function (n) {
      var a = agentInfo(n);
      var bits = '<i></i><span class="who-name">' + esc(a.label) + "</span>";
      if (a.goal) bits += '<span class="who-sep">·</span><span class="who-goal">' + esc(a.goal) + "</span>";
      bits += '<span class="who-sep">·</span><span class="who-state">' + (busy[n] ? "working" : "idle") + "</span>";
      return '<span class="who-chip' + (busy[n] ? " busy" : "") + '" style="--agent:' + a.color +
        '" title="' + esc(n) + '">' + bits + "</span>";
    }).join("");
  }

  function renderMeta(meta) {
    document.getElementById("branch").textContent = "proto_website · " + (meta.branch || "");
    document.getElementById("suites").innerHTML = (meta.suites || []).map(function (s) {
      var ok = s.pass === s.total;
      return '<span class="suite ' + (ok ? "ok" : "part") + '">' + esc(s.name) + "<b>" + s.pass + "/" + s.total + "</b></span>";
    }).join("");
  }

  /* ---------- questions ---------- */
  function renderQuestions() {
    var panel = document.getElementById("qpanel");
    var form = document.getElementById("qform");
    if (!questions.length) { panel.hidden = true; return; }
    panel.hidden = false;
    var html = "";
    questions.forEach(function (q) {
      html += '<div class="q" data-q="' + q.id + '" data-label="' + esc(q.label) + '">';
      html += '<div class="q-head"><span class="q-num">' + (q.id < 10 ? "0" : "") + q.id + '</span><span class="q-title">' + inline(q.title) + "</span></div>";
      html += '<p class="q-why">' + inline(q.why) + "</p><div class='opts'>";
      q.options.forEach(function (o) {
        html += '<button type="button" class="opt" data-key="' + esc(o.key) + '" data-answer="' + esc(o.answer) + '">' +
          '<span class="opt-key">' + esc(o.key) + "</span><span class='opt-text'><strong>" + inline(o.title) +
          (o.rec ? '<span class="rec">rec</span>' : "") + "</strong><span>" + inline(o.note || "") + "</span></span></button>";
      });
      html += "</div></div>";
    });
    html += '<div class="freeform"><label class="ff-label" for="notes">Anything else</label>' +
      '<textarea id="notes" placeholder="New bugs, changes of mind, or something not listed."></textarea></div>';
    html += '<div class="actions"><button type="button" class="primary" id="copy">Copy answers</button>' +
      '<button type="button" class="ghost" id="reset">Clear</button><span class="copied" id="copied">copied</span></div>';
    html += '<div class="out" id="out">Nothing selected yet.</div>';
    form.innerHTML = html;
    document.getElementById("notes").value = notesValue;
    wireQuestions();
    paint();
  }

  function summary() {
    var lines = [];
    questions.forEach(function (q) {
      var picked = state[q.id];
      if (!picked) return;
      q.options.forEach(function (o) {
        if (o.key === picked) lines.push("Q" + q.id + " " + q.label + ": " + picked + " - " + o.answer);
      });
    });
    if (notesValue.trim()) lines.push("Notes: " + notesValue.trim());
    return lines;
  }

  function paint() {
    if (!questions.length) return;
    var count = 0;
    questions.forEach(function (q) {
      var opts = document.querySelectorAll('.q[data-q="' + q.id + '"] .opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].setAttribute("aria-pressed", state[q.id] === opts[i].getAttribute("data-key") ? "true" : "false");
      }
      if (state[q.id]) count++;
    });
    document.getElementById("answered").textContent = count + " of " + questions.length;
    var out = document.getElementById("out");
    if (out) { var l = summary(); out.textContent = l.length ? l.join("\n") : "Nothing selected yet."; }
  }

  function wireQuestions() {
    var form = document.getElementById("qform");
    form.onclick = function (e) {
      var btn = e.target.closest(".opt");
      if (!btn) return;
      var id = btn.closest(".q").getAttribute("data-q");
      var key = btn.getAttribute("data-key");
      state[id] = state[id] === key ? null : key;
      save(); paint();
    };
    document.getElementById("notes").oninput = function () { notesValue = this.value; save(); paint(); };
    document.getElementById("copy").onclick = function () {
      var l = summary();
      var text = l.length ? l.join("\n") : "No answers selected.";
      var done = function () {
        var c = document.getElementById("copied");
        c.classList.add("show"); setTimeout(function () { c.classList.remove("show"); }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { window.prompt("Copy this:", text); });
      } else { window.prompt("Copy this:", text); }
    };
    document.getElementById("reset").onclick = function () {
      state = {}; notesValue = ""; document.getElementById("notes").value = ""; save(); paint();
    };
  }

  document.getElementById("addbar").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("add-text");
    var section = document.getElementById("add-section").value;
    var msg = document.getElementById("add-msg");
    var btn = document.getElementById("add-btn");
    var text = input.value.trim();
    if (!text) { input.focus(); return; }

    btn.disabled = true;
    msg.className = "add-msg";
    msg.textContent = "saving…";
    fetch("/api/add-todo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, section: section, by: "you" })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.body.success) throw new Error(res.body.error || "Could not save.");
        input.value = "";
        msg.className = "add-msg ok";
        msg.textContent = "added to " + section;
        lastTodo = null; // force a redraw on the next poll
        poll();
        setTimeout(function () { msg.textContent = ""; msg.className = "add-msg"; }, 2600);
      })
      .catch(function (err) {
        msg.className = "add-msg err";
        // The board is readable from a plain static host, but adding needs the
        // preview server's write endpoint. Say which, rather than just failing.
        msg.textContent = String(err.message || err) + " · is npm run preview running?";
      })
      .finally(function () { btn.disabled = false; });
  });

  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest(".more");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    expanded[id] = !expanded[id];
    // Re-render straight from cache. This used to force a network poll first,
    // which is why expanding a card sometimes felt slow.
    renderBoard(cardsCache);
  });

  // ---- writing back to todo.md ----

  // One endpoint for both gestures. `status` moves the card, `verdict`/`note`
  // record what you thought of it. `expect` lets the server refuse the write if
  // todo.md shifted since this board last read it.
  function sendUpdate(card, payload, flash) {
    var body = {
      line: Number(card.getAttribute("data-line")),
      lane: card.getAttribute("data-lane"),
      expect: card.getAttribute("data-expect"),
      by: "you"
    };
    for (var k in payload) body[k] = payload[k];

    card.classList.add("busy");
    return fetch("/api/todo-update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.body.success) throw new Error(res.body.error || "Could not save.");
        delete noteDrafts[card.getAttribute("data-id")];
        lastTodo = null; lastReview = null; // force a redraw
        poll();
      })
      .catch(function (err) {
        card.classList.remove("busy");
        setLive("down", String(err.message || err));
        if (flash) flash();
      });
  }

  var dragging = null;

  document.getElementById("board").addEventListener("dragstart", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    // Selecting text in the feedback field, clicking a priority chip, or
    // editing the title must not drag the card out from under it.
    if (e.target.closest(".review") || e.target.closest(".prio-row") ||
        e.target.closest(".title-edit") || e.target.closest(".eb")) { e.preventDefault(); return; }
    dragging = card;
    card.classList.add("dragging");
    // Firefox will not start a drag without payload on the transfer.
    try { e.dataTransfer.setData("text/plain", card.getAttribute("data-id")); } catch (err) {}
    e.dataTransfer.effectAllowed = "move";
  });

  document.getElementById("board").addEventListener("dragend", function () {
    if (dragging) dragging.classList.remove("dragging");
    dragging = null;
    Array.prototype.forEach.call(document.querySelectorAll(".col-body.over"), function (b) {
      b.classList.remove("over");
    });
  });

  document.getElementById("board").addEventListener("dragover", function (e) {
    var body = e.target.closest(".col-body");
    if (!body || !dragging) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    body.classList.add("over");
  });

  document.getElementById("board").addEventListener("dragleave", function (e) {
    var body = e.target.closest(".col-body");
    if (body && !body.contains(e.relatedTarget)) body.classList.remove("over");
  });

  document.getElementById("board").addEventListener("drop", function (e) {
    var body = e.target.closest(".col-body");
    if (!body || !dragging) return;
    e.preventDefault();
    body.classList.remove("over");
    var status = body.getAttribute("data-status");
    var card = dragging;
    dragging = null;
    card.classList.remove("dragging");
    sendUpdate(card, { status: status });
  });

  document.getElementById("board").addEventListener("input", function (e) {
    var input = e.target.closest(".rnote");
    if (!input) return;
    noteDrafts[input.closest(".card").getAttribute("data-id")] = input.value;
    save();
  });

  // ---- inline title editing ----
  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest(".eb");
    if (!btn) return;
    var card = btn.closest(".card");
    var titleEl = card.querySelector(".card-title");
    if (!titleEl || card.querySelector(".title-edit")) return;

    var input = document.createElement("input");
    input.type = "text";
    input.className = "title-edit";
    input.setAttribute("aria-label", "Card text");
    input.value = titleEl.getAttribute("data-text") || "";
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    var closed = false;
    var done = function (commit) {
      if (closed) return;
      closed = true;
      var next = input.value.replace(/\s+/g, " ").trim();
      if (commit && next && next !== titleEl.getAttribute("data-text")) {
        sendUpdate(card, { text: next });
      } else {
        lastTodo = null; // put the rendered title back
        poll();
      }
    };
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); done(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); done(false); }
    });
    input.addEventListener("blur", function () { done(true); });
  });

  document.getElementById("board").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var input = e.target.closest(".rnote");
    if (!input) return;
    e.preventDefault();
    var card = input.closest(".card");
    if (input.value.trim()) sendUpdate(card, { note: input.value.trim() });
  });

  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest(".col-toggle");
    if (!btn) return;
    var key = "col:" + btn.getAttribute("data-col");
    expanded[key] = !expanded[key];
    renderBoard(cardsCache);
  });

  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest(".pb");
    if (!btn) return;
    var card = btn.closest(".card");
    var p = Number(btn.getAttribute("data-prio"));
    var current = Number(card.getAttribute("data-priority") || 0);
    // Clicking the active label clears it; the server strips the token on 0.
    sendUpdate(card, { priority: p === current ? 0 : p });
  });

  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest(".vb");
    if (!btn) return;
    var card = btn.closest(".card");
    var verdict = btn.getAttribute("data-verdict");
    var note = (card.querySelector(".rnote") || {}).value || "";
    var payload = { note: note.trim() };

    // A verdict is also a decision about where the card belongs: something that
    // works is verified and done, something with an issue goes back to the queue.
    if (verdict === "works") { payload.verdict = "works"; payload.status = "x"; }
    else if (verdict === "issue") { payload.verdict = "issue"; payload.status = " "; }
    else if (!payload.note) { return; }

    sendUpdate(card, payload);
  });

  function setLive(kind, text) {
    document.getElementById("live").className = "live" + (kind ? " " + kind : "");
    document.getElementById("live-text").textContent = text;
  }

  // An open tab runs whatever tracker.html it loaded, forever; new features
  // land on disk and silently do not exist here. Watch our own Last-Modified
  // and offer a reload when the file changes underneath us.
  var pageStamp = null;
  function checkPageVersion() {
    fetch("/.tracker/tracker.html", { method: "HEAD", cache: "no-store" }).then(function (r) {
      var lm = r.headers.get("Last-Modified");
      if (!lm) return;
      if (pageStamp === null) { pageStamp = lm; return; }
      if (lm !== pageStamp) document.getElementById("reload-hint").hidden = false;
    }).catch(function () {});
  }
  document.getElementById("reload-hint").addEventListener("click", function () { location.reload(); });

  var cardsCache = [], feedCache = [];

  function poll() {
    var bust = "?t=" + Date.now();
    var get = function (u, json) {
      return fetch(u + bust, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return json ? r.json() : r.text();
      });
    };
    // The registry names the per-agent feeds, so those fetches hang off it and
    // the whole lot still lands as one entry in the batch below. An empty or
    // missing registry is fine: the board falls back to hashed colours.
    var roster = get("/.tracker/agents.json", true)
      .catch(function () { return null; })
      .then(function (reg) {
        var list = (reg && Array.isArray(reg.agents)) ? reg.agents : [];
        return Promise.all(list.map(function (a) {
          return get("/.tracker/feed/" + encodeURIComponent(a.id) + ".jsonl", false)
            .then(function (text) { return parseJsonl(text, a.id); })
            .catch(function () { return []; });
        })).then(function (chunks) {
          return { agents: list, lines: [].concat.apply([], chunks) };
        });
      })
      .catch(function () { return { agents: [], lines: [] }; });

    Promise.all([
      get("/.agents/todo.md", false),
      get("/.tracker/tracker-questions.json", true),
      get("/.tracker/tracker-feed.json", true).catch(function () { return []; }),
      get("/.agents/review-feedback.json", true).catch(function () { return []; }),
      get("/.tracker/card-meta.json", true).catch(function () { return {}; }),
      roster
    ]).then(function (res) {
      var md = res[0], meta = res[1], feed = res[2] || [], review = res[3] || [], cardMeta = res[4] || {};
      var roll = res[5] || { agents: [], lines: [] };
      // Never re-render while typing in a card: a poll that swaps the DOM out
      // from under a draft or an open title editor throws the typing away. The
      // change stays unconsumed, so it renders on the first poll after focus
      // leaves the card.
      var typingInCard = document.activeElement && document.activeElement.closest &&
        document.activeElement.closest("#board .card");
      // Colours and names are read out of the registry at render time, so apply
      // it first. Only a change to it needs to force the board to redraw.
      var agentsStr = JSON.stringify(roll.agents);
      var agentsChanged = agentsStr !== lastAgents;
      if (agentsChanged) { lastAgents = agentsStr; setRegistry(roll.agents); }
      var reviewStr = JSON.stringify(review);
      var reviewChanged = reviewStr !== lastReview;
      if (reviewChanged && !typingInCard) { lastReview = reviewStr; indexFeedback(review); }
      var cardMetaStr = JSON.stringify(cardMeta);
      var cardMetaChanged = cardMetaStr !== lastCardMeta;
      if (cardMetaChanged && !typingInCard) { lastCardMeta = cardMetaStr; cardMetaIndex = cardMeta; }
      if ((md !== lastTodo || reviewChanged || cardMetaChanged || agentsChanged) && !typingInCard) {
        lastTodo = md; cardsCache = parseTodo(md); renderBoard(cardsCache);
      }
      var metaStr = JSON.stringify(meta);
      if (metaStr !== lastMeta) {
        lastMeta = metaStr; renderMeta(meta);
        questions = meta.questions || []; renderQuestions();
      }
      // One feed out of many files: the shared tracker-feed.json plus a .jsonl
      // per agent. renderFeed sorts, so which file a line came from stops
      // mattering the moment it is merged.
      var merged = (Array.isArray(feed) ? feed : []).concat(roll.lines);
      var feedStr = JSON.stringify(merged);
      if (feedStr !== lastFeed) { lastFeed = feedStr; feedCache = merged; renderFeed(merged); }
      renderWho(cardsCache, feedCache);
      lastOk = Date.now();
      setLive("", "live · " + new Date().toLocaleTimeString());
    }).catch(function () {
      if (!lastOk) setLive("down", "server not running · npm run preview");
      else setLive("stale", "stale · last read " + new Date(lastOk).toLocaleTimeString());
    });
  }

  poll();
  setInterval(poll, POLL_MS);
  checkPageVersion();
  setInterval(checkPageVersion, 20000);
})();
</script>
</body>
</html>
